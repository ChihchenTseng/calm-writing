name: Deploy Test Version

on:
  push:
    branches: [main]
    paths:
      - 't/Calm_Writing_T*.html'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Find latest version file
        run: |
          LATEST=$(ls t/Calm_Writing_T*.html | sort -V | tail -1)
          echo "LATEST=$LATEST" >> $GITHUB_ENV

      - name: Copy to t/index.html
        run: cp "$LATEST" t/index.html

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add t/index.html
          if git diff --cached --quiet; then
            echo "t/index.html already matches $LATEST"
            exit 0
          fi
          git commit -m "Auto update t/index.html from $LATEST"
          git push
