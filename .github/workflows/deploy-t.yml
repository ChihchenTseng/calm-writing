name: Deploy Test Version

on:
  push:
    branches: [main]
    paths:
      - 't/Calm_Writing_T*.html'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Find latest version file
        run: |
          echo "=== Files in t/ ==="
          ls t/
          echo "=== Matching files ==="
          ls t/Calm_Writing_T*.html || echo "No matching files found"
          LATEST=$(ls t/Calm_Writing_T*.html | sort
